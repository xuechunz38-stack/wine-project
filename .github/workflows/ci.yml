name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1" # weekly: catches breakage from upstream changes

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: black (formatting)
        run: python -m black --check .
      - name: flake8 (lint)
        run: python -m flake8 .

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Unit and system tests
        run: python -m pytest
      - name: Run the full analysis
        run: WINE_OUTPUT_DIR=ci-output python analysis.py
      - uses: actions/upload-artifact@v4
        with:
          name: analysis-output-py${{ matrix.python-version }}
          path: ci-output/

  docker:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t wine-quality .
      - name: Run tests inside the container
        run: docker run --rm wine-quality python -m pytest -q
      - name: Run the analysis in the container
        run: |
          mkdir -p output && chmod 777 output
          docker run --rm -v "$PWD/output:/app/output" wine-quality
          ls -l output
          test -f output/threshold_tradeoff.png
